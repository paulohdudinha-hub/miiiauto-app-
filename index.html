<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3 Auto</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 25px;
      text-align: center;
    }

    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 25px;
      border: 2px solid #444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 34px;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .subtitulo {
      color: #aaa;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 25px;
    }

    .card h2 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .card p {
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    button:hover {
      opacity: 0.85;
    }

    .secundario {
      background: #222;
      color: white;
      border: 1px solid #444;
    }

    .rodape {
      margin-top: 25px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      M3
    </div>

    <h1>M3 AUTO</h1>

    <p class="subtitulo">
      Detalhamento automotivo profissional
    </p>

    <div class="card">

      <h2>Bem-vindo à M3 Auto</h2>

      <p>
        Agende seu atendimento, acompanhe seus serviços
        e tenha seus dados sempre à mão.
      </p>

      <button onclick="criarConta()">
        Criar minha conta
      </button>

      <button class="secundario" onclick="entrar()">
        Já tenho uma conta
      </button>

    </div>

    <div class="rodape">
      M3 Auto Detalhamento
    </div>

  </div>

  <script>

    function criarConta() {
      window.location.href = "cadastro.html";
    }

    function entrar() {
      alert("Área de login em desenvolvimento.");
    }

  </script>

</body>
</html>
